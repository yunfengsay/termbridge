name: Termbridge
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Termbridge:
    type: application
    platform: iOS
    sources:
      - path: Termbridge
        excludes:
          - Info.plist
          - Resources/**
      - path: Termbridge/Resources
        excludes:
          - AgentChat/**
          - Desktop/**
        buildPhase: resources
      - path: Termbridge/Resources/AgentChat
        type: folder
        buildPhase: resources
      - path: Termbridge/Resources/Desktop
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termbridge.ios
        PRODUCT_NAME: Termbridge
        INFOPLIST_FILE: Termbridge/Info.plist
    scheme:
      testTargets:
        - TermbridgeTests
  TermbridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TermbridgeTests
    dependencies:
      - target: Termbridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termbridge.ios.tests
  TermbridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TermbridgeUITests
    dependencies:
      - target: Termbridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termbridge.ios.uitests
    scheme:
      testTargets:
        - TermbridgeUITests
